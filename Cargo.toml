[package]
name = "lastpass-ssh-agent"
# A placeholder, and deliberately not a version anyone ships. Releases are
# CalVer, decided by the pipeline that publishes them and recorded in the git
# tag — never committed, so this line cannot drift out of step with what is
# released. `--version` reports the stamp build.rs resolves, not this.
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
description = "SSH agent backed by the LastPass CLI: private keys never persist on disk, every signature is fetched, confirmed, used, and zeroized."
license = "MIT"
# Where the project lives. The release URLs are built from the repository the
# workflow runs in, not from here.
repository = "https://github.com/lexbrugman/lastpass-ssh-agent"

[dependencies]
ssh-agent-lib = "0.6"
async-trait = "0.1"
# Pinned to 0.6.x: ssh-agent-lib depends on ssh-key ^0.6.
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "p256", "p384", "encryption"] }
rsa = { version = "0.9", features = ["sha2"] }
# `getrandom` is what defines OsRng, which signing.rs uses to blind the RSA
# private-key operation. rand_core does not enable it by default — the build
# would otherwise compile only because ssh-key's own feature set happens to
# turn it on, which is no basis for a security mitigation.
rand_core = { version = "0.6", features = ["getrandom"] }
signature = "2"
# `sync` is what the interaction gate, every prompt that serializes itself and
# the Linux screen-lock probe's cached connection are built from. None of the
# other features here imply it, so without this the build compiles only because
# a dependency's feature set happens to turn it on — which is no basis for code
# of ours that will not compile without it.
tokio = { version = "1", features = ["rt", "macros", "net", "process", "io-util", "time", "signal", "sync"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.0"
zeroize = { version = "1", features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dirs = "6"
libc = "0.2"

# Only the macOS Keychain store and the screen-lock probe need these, and they
# are declared per-target so the musl Linux builds never pull an Apple framework
# binding in at all.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# Reading one key out of the dictionary CGSessionCopyCurrentDictionary returns.
core-foundation = "0.10"

# The Linux equivalents of those two: a passphrase store and the screen-lock
# probe. Declared per-target for the same reason, and both are pure Rust, so
# the static musl builds stay static.
[target.'cfg(target_os = "linux")'.dependencies]
# `rt-tokio-crypto-rust` is the feature that keeps this free of C: the session
# with the secret service is encrypted using RustCrypto's AES rather than
# OpenSSL, and zbus runs on the tokio runtime the agent already has.
secret-service = { version = "5", default-features = false, features = ["rt-tokio-crypto-rust"] }
# Reading one property off logind. Pinned to 5.x because secret-service
# depends on zbus ^5: two zbus versions in one binary would each open a bus
# connection of their own. Default features off for the same reason
# secret-service turns them off — they would pull in a second async runtime
# alongside tokio.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

# Strict linting: everything from clippy's pedantic and nursery groups is a
# warning, and CI runs clippy with -D warnings so any finding fails the build.
# Allows below are deliberate, not oversights.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Released binaries are built with this profile, so a local `cargo build
# --release` produces what CI ships rather than something close to it.
[profile.release]
strip = true
lto = "thin"
