[package]
name = "lastpass-ssh-agent"
# A placeholder, and deliberately not a version anyone ships. Releases are
# CalVer, decided by the pipeline that publishes them and recorded in the git
# tag — never committed, so this line cannot drift out of step with what is
# released. `--version` reports the stamp build.rs resolves, not this.
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
description = "SSH agent backed by the LastPass CLI: private keys never persist on disk, every signature is fetched, confirmed, used, and zeroized."
license = "MIT"
# Where the project lives. The release URLs are built from the repository the
# workflow runs in, not from here.
repository = "https://github.com/lexbrugman/lastpass-ssh-agent"

[dependencies]
ssh-agent-lib = "0.6"
async-trait = "0.1"
# Pinned to 0.6.x: ssh-agent-lib depends on ssh-key ^0.6.
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "p256", "p384", "encryption"] }
rsa = { version = "0.9", features = ["sha2"] }
# `getrandom` is what defines OsRng, which signing.rs uses to blind the RSA
# private-key operation. rand_core does not enable it by default — the build
# would otherwise compile only because ssh-key's own feature set happens to
# turn it on, which is no basis for a security mitigation.
rand_core = { version = "0.6", features = ["getrandom"] }
signature = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "process", "io-util", "time", "signal"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.0"
zeroize = { version = "1", features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dirs = "6"
libc = "0.2"

# Only the macOS Keychain store needs this, and it is declared per-target so
# the musl Linux builds never pull an Apple framework binding in at all.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

# Strict linting: everything from clippy's pedantic and nursery groups is a
# warning, and CI runs clippy with -D warnings so any finding fails the build.
# Allows below are deliberate, not oversights.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Released binaries are built with this profile, so a local `cargo build
# --release` produces what CI ships rather than something close to it.
[profile.release]
strip = true
lto = "thin"
