name: Publish release

# Turns the built archives into the GitHub release.
#
# The release is created as a draft, filled, and only then published. A draft
# carries no tag — GitHub creates it at the moment of publishing — so a run
# that dies partway leaves a discardable draft and no tag pointing at a
# release that does not exist. That is also why resolve-release.yml counts
# drafts when it picks the next number.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

# `id-token` and `attestations` are for the provenance attestation below;
# the caller has to grant them too.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Named outright rather than left for gh to work out from the checkout's
      # remote: the release goes to the repository this run belongs to.
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      # For packaging/verify-dist.sh alone. The token is not kept in the
      # checkout: nothing here pushes, and what is released is build output.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # One directory per artifact, not merged: any job in the run can upload
      # an artifact, and merged together one named like a release would land
      # among the real ones — or over one of them.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: artifacts/

      # The checksums were computed on the build runners; these are the files
      # users download. packaging/verify-dist.sh owns what is checked, and
      # leaves in dist/ exactly the eight files that passed.
      - name: Verify what the build jobs handed over
        run: ./packaging/verify-dist.sh artifacts dist

      # A signed statement, kept by GitHub against each archive's digest, that
      # this workflow built it from this commit. It is what `gh attestation
      # verify` checks at install time, and the only thing here a checksum
      # cannot stand in for: the .sha256 files come from the same job as the
      # archives, so whoever could replace one could replace the other. Done
      # before the draft exists, so a release never goes out unattested.
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*.tar.xz

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # --target pins the tag to the commit this run was triggered by, so
          # the release names the tree it was built from even if master has
          # moved on by the time it is published.
          gh release create "v${VERSION}" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "v${VERSION}" \
              --generate-notes \
              dist/*

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # Creates the tag. Everything downstream — the formula's download
          # URLs above all — needs the assets reachable, which they are not
          # while the release is a draft.
          gh release edit "v${VERSION}" --draft=false
