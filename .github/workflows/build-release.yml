name: Build release

# Builds the four published targets and uploads each as a workflow artifact
# for publish-release.yml to attach to the release.
#
# Every target builds on a runner of its own architecture, so nothing is
# cross-linked: the Apple targets share one macOS runner because a single SDK
# covers both, and the musl targets each get a runner of their own. musl needs
# no C toolchain here — the dependency tree is pure Rust, so rustc's
# self-contained musl linking covers it.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          # What `--version` reports. build.rs would otherwise describe the
          # checkout against the newest tag, and the tag for this release does
          # not exist yet — it is created when the release is published.
          LASTPASS_SSH_AGENT_VERSION: ${{ inputs.version }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          archive="lastpass-ssh-agent-${{ matrix.target }}.tar.xz"
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/lastpass-ssh-agent" "$staging/"
          cp README.md "$staging/"
          mkdir -p dist
          # entries at the archive root, no wrapping directory: the formula
          # installs the binary straight out of the staged extraction
          tar -cJf "dist/$archive" -C "$staging" lastpass-ssh-agent README.md
          cd dist
          # "<hash> *<name>" — the shape generate-formula.sh parses and
          # `sha256sum -c` accepts. The two platforms ship different tools.
          if command -v sha256sum > /dev/null; then
              sha256sum -b "$archive" > "$archive.sha256"
          else
              shasum -a 256 -b "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
