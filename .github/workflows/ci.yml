name: CI

on:
  # master is covered by release-on-master.yml, which gates the release on
  # this same workflow
  push:
    branches: [dev]
  pull_request:
  # release.yml runs this first: nothing ships that has not passed the gate
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy (check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # the tests run instrumented, which requires nightly for branch coverage
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/test.sh

  # Release artifacts are dist's job (see release.yml); this only proves the
  # stable toolchain still builds, since the tests run on nightly.
  build:
    name: release build (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
