name: CI

# The whole pipeline, as one run per push. Checks on every branch; on master
# the same run goes on to build and publish a release.
#
# Nothing here is triggered by a tag or dispatched from another workflow. The
# release tag is created by publishing the release, at the end of this run —
# so there is no second workflow to start, no credential beyond the built-in
# token, and no version commit on any branch. Whether a push releases is
# decided in exactly one place, resolve-release.yml, and every job below keys
# off its output rather than testing the branch itself.
on:
  push:
    # Branches only. Publishing a release creates its tag, and a tag that
    # re-entered this pipeline would try to release again.
    branches: ['**']

# One run at a time per branch. Two master runs must not resolve the same
# version, so they queue instead — and a release must never be cancelled
# halfway, which is why only the other branches supersede themselves.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Raised per job, only where it is needed: the checks and the builds never get
# write access, and a called workflow cannot raise what it is given.
permissions:
  contents: read

jobs:
  release-version:
    uses: ./.github/workflows/resolve-release.yml

  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  build-release:
    needs: [release-version, checks]
    if: needs.release-version.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.release-version.outputs.version }}

  publish-release:
    needs: [release-version, checks, build-release]
    if: needs.release-version.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.release-version.outputs.version }}

  # Last, and only once the release is published: the formula points at the
  # release's download URLs, which nothing can fetch until then.
  publish-homebrew-formula:
    needs: [release-version, publish-release]
    if: needs.release-version.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/publish-homebrew-formula.yml
    with:
      version: ${{ needs.release-version.outputs.version }}
    secrets: inherit
