name: CI

on:
  # Every branch except master, which release-on-master.yml covers by calling
  # this workflow as its gate. Pushes rather than pull requests: a branch is
  # pushed before any pull request exists for it, and checks attach to the
  # commit, so they still show up on the pull request that follows.
  push:
    branches-ignore: [master]
  # release-on-master.yml runs this before it releases anything
  workflow_call:

# release-on-master.yml calls this workflow as the release gate, and a called
# workflow runs with the caller's token — which there carries contents:write
# and actions:write, to push the version bump and dispatch the release.
# Nothing here needs either, and the third-party actions below would inherit
# them, so pin it down: a called workflow may lower permissions, never raise
# them.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to exact releases rather than floating major tags, so
# Renovate raises a pull request for every patch; @v7 would stay silent until
# v8. The toolchain actions are the exception — `stable` and `nightly` are
# branch references, and resolving them fresh is the whole point.
jobs:
  lint:
    name: fmt + clippy (check only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --check
      - run: ./packaging/homebrew/test-generate-formula.sh
      - run: cargo clippy --all-targets -- -D warnings

  # Advisories are time-based rather than code-based: a dependency that was
  # clean yesterday can be vulnerable today without anything here changing.
  # Running it in the gate means no release goes out under an advisory nobody
  # has looked at, and every Renovate dependency pull request re-runs it, so
  # a newly published one surfaces without anyone pushing code.
  audit:
    name: advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-audit
      # Fails on any advisory against the locked tree except those
      # .cargo/audit.toml accepts, each recorded there with its reasoning.
      - run: cargo audit

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      # the tests run instrumented, which requires nightly for branch coverage
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2.9.2
      - run: ./scripts/test.sh
