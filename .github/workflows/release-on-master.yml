name: Release on master

# Every push to master that passes the gate becomes an installable release.
# No tagging by hand: the version is derived from the date, and the release
# workflow is dispatched from here. Other branches (dev) never release —
# they only run ci.yml.
on:
  push:
    branches: [master]

# Serialize releases: two overlapping runs would race for the same version
# number. Never cancel a run mid-release.
concurrency:
  group: release-on-master
  cancel-in-progress: false

permissions:
  contents: write # push the version bump
  actions: write # dispatch the release workflow

jobs:
  # Tag nothing that has not passed formatting, lints and the tests at 100%
  # coverage on both platforms.
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # tags are needed to work out today's next patch number
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          year="$(date -u +%Y)"
          # MMDD as a number: semver forbids the leading zero in "0810"
          month_day="$((10#$(date -u +%m%d)))"
          patch=0
          while git rev-parse -q --verify "refs/tags/v${year}.${month_day}.${patch}" >/dev/null; do
              patch="$((patch + 1))"
          done
          echo "version=${year}.${month_day}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Record it in the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]

          # [package] version only: dependency versions are inline tables, so
          # they never start a line, and cargo-dist-version is a different key
          toml = open("Cargo.toml").read()
          toml, count = re.subn(r'(?m)^version = "[^"]*"', f'version = "{version}"', toml, count=1)
          assert count == 1, "no [package] version to update"
          open("Cargo.toml", "w").write(toml)

          # dist compares the tag against the package version, and cargo
          # refuses to build with a stale lockfile
          lock = open("Cargo.lock").read()
          lock, count = re.subn(
              r'(?ms)(^\[\[package\]\]\nname = "lastpass-ssh-agent"\nversion = ")[^"]*(")',
              rf'\g<1>{version}\g<2>',
              lock,
              count=1,
          )
          assert count == 1, "no lockfile entry to update"
          open("Cargo.lock", "w").write(lock)
          PY

      - name: Commit the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
              # already at this version: the first release of the day, or a
              # retry after the bump was pushed but the dispatch failed
              echo "version $VERSION is already recorded"
          else
              git commit -m "release $VERSION"
              # pushed with GITHUB_TOKEN, so this does not start another run
              git push origin HEAD:master
          fi

      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          newest() {
              gh run list --workflow=release.yml --event=workflow_dispatch \
                  --limit=1 --json databaseId --jq '.[0].databaseId // 0'
          }
          # Remember what the newest run was, so the new one can be told
          # apart from it: the API may not list ours for a few seconds, and
          # watching a finished earlier release would defeat the whole point.
          previous="$(newest)"

          # workflow_dispatch is the one event GITHUB_TOKEN may still trigger,
          # which is why dist is configured with dispatch-releases
          gh workflow run release.yml --ref master -f "tag=v${VERSION}"

          run_id=""
          for _ in $(seq 60); do
              current="$(newest)"
              # run ids only ever increase, so "not the one from before" is
              # exactly "the one we just started"
              if [ "$current" != "$previous" ] && [ "$current" != "0" ]; then
                  run_id="$current"
                  break
              fi
              sleep 5
          done
          if [ -z "$run_id" ]; then
              echo "dispatched release never appeared" >&2
              exit 1
          fi

          # Follow it to completion. The version comes from the tag list, and
          # dist only creates the tag while publishing — returning early would
          # let the next push pick the same number.
          gh run watch "$run_id" --exit-status
