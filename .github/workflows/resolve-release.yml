name: Resolve release

# The one place a release version is decided. Every downstream job keys off
# the output: a non-empty version means "this push releases", and nothing else
# in the pipeline looks at the branch. Pushes to any other branch, dev
# included, resolve to an empty string and only run the checks.
on:
  workflow_call:
    outputs:
      version:
        description: The version to release, or empty on a branch that does not release.
        value: ${{ jobs.resolve.outputs.version }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # No checkout: the version comes from the releases that already exist,
      # which is an API call, and nothing here reads the tree.
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "$GITHUB_REF does not release"
              exit 0
          fi

          # Every release that exists, drafts included. Drafts matter: one is
          # left behind by a release that failed after its assets went up, it
          # holds no tag, and reusing its number would collide the moment it
          # was ever published.
          taken="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[].tag_name')"

          year="$(date -u +%Y)"
          # MMDD as a number: semver forbids the leading zero in "0810"
          month_day="$((10#$(date -u +%m%d)))"
          patch=0
          while printf '%s\n' "$taken" | grep -qx "v${year}.${month_day}.${patch}"; do
              patch="$((patch + 1))"
          done

          version="${year}.${month_day}.${patch}"
          echo "releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
