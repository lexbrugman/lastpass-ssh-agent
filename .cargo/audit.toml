# Configuration for `cargo audit`, which CI runs against Cargo.lock. Kept in
# the repository rather than passed as a CI flag so that running it locally
# — `docker compose run --rm audit` — gives the same answer as CI, and so
# every accepted advisory carries its reasoning where a reviewer will find it.

[advisories]
# RUSTSEC-2023-0071 — "Marvin Attack", a timing sidechannel in `rsa`
# (medium, 5.9). Accepted rather than fixed, because there is nothing to fix
# to: the advisory has had no patched release in any version line since 2023.
# This agent uses `rsa` directly because ssh-key 0.6 cannot honor the SSH
# agent's requested RSA digest correctly; dropping it means dropping RSA key
# support until that upstream path changes.
#
# Mitigation: every RSA signature uses the crate's randomized signing API
# with fresh OsRng input. That enables RSA blinding around the private-key
# operation, making repeated timings substantially harder to correlate with
# client-chosen inputs. Signing is also gated on a human confirmation by
# default, bounding samples to roughly one per dialog.
#
# Residual risk: blinding is a mitigation, not a constant-time rewrite, so
# the advisory remains applicable and ignored explicitly rather than called
# fixed. It matters most with `confirm = "off"` on a forwarded RSA key.
#
# Revisit when a fixed release appears: the audit is what will say so.
#
# RUSTSEC-2026-0387 — secret-dependent timing in `crypto-bigint` 0.5
# (subtraction, division, Montgomery multiplication, limb-wise equality).
# Accepted rather than fixed for the same reason: the fix is 0.7.6, and 0.5 is
# what elliptic-curve 0.13 builds on, which p256 and p384 pin for ssh-key 0.6 —
# the chain renovate.json describes. It lifts with ssh-key 0.7, together with
# the exception above.
#
# Where it reaches: the scalar arithmetic of an ECDSA signature over a P-256
# or P-384 key. ed25519 and RSA keys do not go through it.
#
# Mitigation: as above — signing is gated on a human confirmation by default,
# bounding samples to roughly one per dialog, and no key is cached, so the
# private scalar exists only for the one operation.
#
# Every other advisory, present or future, remains a hard failure.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]
